server:
  port: 8080
  host: "0.0.0.0"

logging:
  level: "info" # "debug", "info", "warn", "error"
  path: "app.log"

database:
  path: "history.db"

file_server:
  enabled: true
  secure_dir: "/var/log/secure_files" # Example secure directory

command_executor:
  enabled: true
  default_timeout: "30s" # Default call timeout when not overridden per command or per API call
  default_timeout_seconds: 30
  max_timeout_seconds: 300
  commands:
    - name: "list-processes"
      command: "ps"
      args: ["aux"]
      timeout: "30s"
    - name: "disk-usage"
      command: "df"
      args: ["-h"]
      timeout: "15s"
