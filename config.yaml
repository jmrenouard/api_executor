server:
  port: 8080
  host: "0.0.0.0"
  tls:
    enabled: true
    auto_generate: true
    cert_file: "certs/server.crt"
    key_file: "certs/server.key"
    organization: "Go Admin Tool"
    validity_days: 365
    min_version: "1.2"
    hosts:
      - "localhost"
      - "127.0.0.1"

logging:
  level: "info" # "debug", "info", "warn", "error"
  path: "app.log"

database:
  path: "history.db"

file_server:
  enabled: true
  secure_dir: "/var/log/secure_files" # Example secure directory

command_executor:
  enabled: true
  default_timeout: "30s" # Default call timeout when not overridden per command or per API call
  default_timeout_seconds: 30
  max_timeout_seconds: 300
  commands:
    - name: "list-processes"
      command: "ps"
      args: ["aux"]
      timeout: "30s"
    - name: "disk-usage"
      command: "df"
      args: ["-h"]
      timeout: "15s"

multi_config:
  enabled: true
  endpoint: "/api/v1/config"
  default_profile: "default"
  profiles:
    - name: "default"
      path: "config.yaml"
      description: "Default server administration commands"
    - name: "ubuntu"
      path: "configs/ubuntu-tasks.yaml"
      description: "Ubuntu 22.04/24.04 administration tasks"
    - name: "redhat"
      path: "configs/redhat-tasks.yaml"
      description: "RedHat Enterprise Linux / UBI9 administration tasks"

otlp_export:
  enabled: true
  endpoint: "" # Optional remote OTLP collector endpoint (e.g. "http://localhost:4318/v1/metrics")
  push_interval: "30s"
  timeout: "10s"
  resource_attributes:
    service.name: "api-executor"
    service.version: "2.2.0"
    deployment.environment: "production"
  headers: {}
    # Authorization: "Bearer <token>"
    # DD-API-KEY: "<datadog-api-key>"

