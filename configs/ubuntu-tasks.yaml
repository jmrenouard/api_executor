server:
  port: 8080
  host: "0.0.0.0"
  tls:
    enabled: true
    auto_generate: true
    cert_file: "certs/server.crt"
    key_file: "certs/server.key"
    organization: "API Executor Ubuntu Node"
    validity_days: 365
    min_version: "1.2"
    hosts:
      - "localhost"
      - "127.0.0.1"
      - "ubuntu-node"

logging:
  level: "info"
  path: ""

database:
  path: "history.db"

file_server:
  enabled: true
  secure_dir: "/var/log/secure_files"

command_executor:
  enabled: true
  default_timeout: "30s"
  default_timeout_seconds: 30
  max_timeout_seconds: 300
  enable_os_presets: true
  os_presets:
    - "ubuntu"
  commands:
    - name: "ubuntu-os-release"
      description: "Inspect Ubuntu / Debian distribution metadata (/etc/os-release)"
      os_family: "ubuntu"
      category: "system"
      command: "cat"
      args: ["/etc/os-release"]
      timeout: "10s"
    - name: "ubuntu-dpkg-packages"
      description: "List installed Debian/Ubuntu packages via dpkg-query"
      os_family: "ubuntu"
      category: "packages"
      command: "dpkg-query"
      args: ["-W", "-f=${binary:Package}\t${Version}\t${Architecture}\n"]
      timeout: "20s"
    - name: "ubuntu-apt-simulated-upgrade"
      description: "Dry-run simulation of pending APT package upgrades"
      os_family: "ubuntu"
      category: "packages"
      command: "apt-get"
      args: ["-s", "upgrade"]
      timeout: "30s"
    - name: "ubuntu-disk-space"
      description: "Report Ubuntu filesystem disk space usage"
      os_family: "ubuntu"
      category: "storage"
      command: "df"
      args: ["-h"]
      timeout: "10s"
