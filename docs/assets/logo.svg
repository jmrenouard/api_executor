<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">API Executor Logo</title>
  <desc id="logoDesc">Hexagonal zero-trust shield emblem with terminal prompt, cryptographic lock ring, and modular telemetry nodes for API Executor.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080b11"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Frame -->
  <rect x="12" y="12" width="232" height="232" rx="44" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="3"/>
  <rect x="20" y="20" width="216" height="216" rx="36" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Hexagonal Security Core -->
  <polygon points="128,36 208,82 208,174 128,220 48,174 48,82"
           fill="#0b1120" stroke="url(#emeraldGrad)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Inner Circuit Ring -->
  <polygon points="128,54 192,91 192,165 128,202 64,165 64,91"
           fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Command Prompt Chevron (>) -->
  <path d="M86 102 L118 128 L86 154"
        fill="none" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Active Cursor Underscore (_) -->
  <line x1="130" y1="154" x2="168" y2="154"
        stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round"/>

  <!-- TLS & Audit Telemetry Nodes -->
  <circle cx="128" cy="36" r="6" fill="#34d399"/>
  <circle cx="208" cy="82" r="5" fill="#38bdf8"/>
  <circle cx="208" cy="174" r="5" fill="#38bdf8"/>
  <circle cx="128" cy="220" r="6" fill="#34d399"/>
  <circle cx="48" cy="174" r="5" fill="#38bdf8"/>
  <circle cx="48" cy="82" r="5" fill="#38bdf8"/>

  <!-- Top Security Badge Pill -->
  <rect x="96" y="70" width="64" height="18" rx="9" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="128" y="83" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1">TLS 1.3</text>
</svg>
