id: sys-sysctl-params
name: Kernel Runtime Parameters & Subsystem Tuning
version: 1.0.0
category: SysAdmin
description: Audit active Linux kernel sysctl parameters across network, memory, and
  filesystem subsystems.
os_family: linux
actions:
- name: kernel_parameters
  description: Dump all active kernel sysctl configuration settings
  command: sysctl
  args:
  - -a
  timeout: 5s
