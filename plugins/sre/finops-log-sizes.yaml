id: finops-log-sizes
name: FinOps System Log Directory Storage Footprint
version: 1.0.0
category: SRE
description: Calculate disk consumption of log directory to detect runaway disk space
  growth.
os_family: linux
actions:
- name: log_dir_size
  description: Compute storage footprint of log directory
  command: du
  args:
  - -sh
  - '{{dir}}'
  timeout: 5s
  parameters:
  - name: dir
    type: string
    required: false
    default: /var/log
    pattern: ^/[a-zA-Z0-9._/-]+$
    description: Log directory path
