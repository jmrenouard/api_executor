id: prom-scrape-endpoint
name: Prometheus Metrics Endpoint Scraper & Parser
version: 1.0.0
category: SRE
description: Fetch raw Prometheus metric exposition text from local or remote target
  endpoint.
os_family: any
actions:
- name: scrape_metrics
  description: Scrape HTTP /metrics endpoint via curl
  command: curl
  args:
  - -s
  - http://{{host}}:{{port}}/metrics
  timeout: 5s
  parameters:
  - name: host
    type: string
    required: false
    default: 127.0.0.1
    pattern: ^[a-zA-Z0-9.-]+$
    description: Target metrics host
  - name: port
    type: string
    required: false
    default: '9090'
    pattern: ^[0-9]+$
    description: Target metrics TCP port
