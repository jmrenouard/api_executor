id: sec-empty-passwords
name: Empty & Null Password Hashes Scanner
version: 1.0.0
category: SecOps
description: Scan shadow password database for accounts configured with empty or null
  password hashes.
os_family: linux
actions:
- name: check_empty_passwords
  description: Find accounts with blank password hash fields in /etc/shadow
  command: awk
  args:
  - '-F:'
  - $2 == "" {print $1}
  - /etc/shadow
  timeout: 5s
