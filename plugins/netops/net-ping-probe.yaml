id: net-ping-probe
name: ICMP Echo Network Reachability & Latency Probe
version: 1.0.0
category: NetOps
description: Send ICMP echo request packets to verify network reachability, packet
  loss, and RTT latency.
os_family: linux
actions:
- name: icmp_echo
  description: Send specified number of ICMP packets to target host
  command: ping
  args:
  - -c
  - '{{count}}'
  - -W
  - '{{timeout}}'
  - '{{target}}'
  timeout: 5s
  parameters:
  - name: target
    type: string
    required: true
    default: 127.0.0.1
    pattern: ^[a-zA-Z0-9.-]+$
    description: Destination hostname or IP address
  - name: count
    type: string
    required: false
    default: '3'
    pattern: ^[0-9]+$
    description: Number of ICMP packets to send
  - name: timeout
    type: string
    required: false
    default: '3'
    pattern: ^[0-9]+$
    description: Timeout in seconds to wait for responses
