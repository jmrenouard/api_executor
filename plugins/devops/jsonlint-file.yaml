id: jsonlint-file
name: JSON File Syntax & Schema Validation Tool
version: 1.0.0
category: DevOps
description: Validate JSON file formatting and parse errors via python3 json.tool
  validator.
os_family: any
actions:
- name: validate_json
  description: Validate JSON syntax using json.tool
  command: python3
  args:
  - -m
  - json.tool
  - '{{file}}'
  timeout: 5s
  parameters:
  - name: file
    type: string
    required: false
    default: /tmp/package.json
    pattern: ^/[a-zA-Z0-9._/-]+$
    description: Path to JSON file to validate
