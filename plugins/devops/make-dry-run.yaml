id: make-dry-run
name: Makefile Build Targets Dry-Run Execution
version: 1.0.0
category: DevOps
description: Test Makefile build targets in dry-run mode without executing command
  recipes.
os_family: any
actions:
- name: dry_run
  description: Dry-run execution of make target
  command: make
  args:
  - -n
  - '{{target}}'
  timeout: 5s
  parameters:
  - name: target
    type: string
    required: false
    default: all
    pattern: ^[a-zA-Z0-9._-]+$
    description: Target makefile recipe name
