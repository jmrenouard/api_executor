id: k8s-top-pods
name: Pod CPU & Memory Resource Utilization Metrics
version: 1.0.0
category: Kubernetes
description: Display CPU and memory consumption metrics for pods in a specified namespace.
os_family: any
actions:
- name: pod_resource_metrics
  description: Query CPU and memory metrics for pods in namespace
  command: kubectl
  args:
  - top
  - pods
  - -n
  - '{{namespace}}'
  timeout: 5s
  parameters:
  - name: namespace
    type: string
    required: false
    default: default
    pattern: ^[a-zA-Z0-9._-]+$
    description: Target Kubernetes namespace
