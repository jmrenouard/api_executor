id: k8s-daemonsets
name: Kubernetes DaemonSets & Node Coverage Auditor
version: 1.0.0
category: Kubernetes
description: Enumerate DaemonSets, desired scheduled nodes, and currently ready instances
  across cluster nodes.
os_family: any
actions:
- name: list_daemonsets
  description: List DaemonSets and scheduled node counts
  command: kubectl
  args:
  - get
  - daemonsets
  - -n
  - '{{namespace}}'
  timeout: 5s
  parameters:
  - name: namespace
    type: string
    required: false
    default: default
    pattern: ^[a-zA-Z0-9._-]+$
    description: Target Kubernetes namespace
