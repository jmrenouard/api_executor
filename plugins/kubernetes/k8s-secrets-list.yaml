id: k8s-secrets-list
name: Kubernetes Secret Metadata (Names & Types Only)
version: 1.0.0
category: Kubernetes
description: Enumerate Secret resources and secret types without displaying or revealing
  sensitive payload data.
os_family: any
actions:
- name: list_secret_metadata
  description: List secret metadata in namespace without sensitive data
  command: kubectl
  args:
  - get
  - secrets
  - -n
  - '{{namespace}}'
  timeout: 5s
  parameters:
  - name: namespace
    type: string
    required: false
    default: default
    pattern: ^[a-zA-Z0-9._-]+$
    description: Target Kubernetes namespace
