id: mcp-resources-list
name: Model Context Protocol (MCP) Resources Registry Discovery
version: 1.0.0
category: AIOps
description: List readable resources and URIs exposed by Model Context Protocol (MCP)
  server.
os_family: any
actions:
- name: list_resources
  description: Query MCP resources/list method via JSON-RPC
  command: curl
  args:
  - -s
  - -X
  - POST
  - http://{{host}}:{{port}}/api/v1/mcp
  - -H
  - 'Content-Type: application/json'
  - -d
  - '{"jsonrpc":"2.0","id":3,"method":"resources/list"}'
  timeout: 5s
  parameters:
  - name: host
    type: string
    required: false
    default: 127.0.0.1
    pattern: ^[a-zA-Z0-9.-]+$
    description: MCP server host
  - name: port
    type: string
    required: false
    default: '8080'
    pattern: ^[0-9]+$
    description: MCP server port
