id: chroma-heartbeat
name: ChromaDB Embedded Vector Store Heartbeat
version: 1.0.0
category: AIOps
description: Query ChromaDB vector database heartbeat endpoint for service responsiveness.
os_family: any
actions:
- name: check_heartbeat
  description: Query ChromaDB heartbeat endpoint
  command: curl
  args:
  - -s
  - http://{{host}}:{{port}}/api/v1/heartbeat
  timeout: 5s
  parameters:
  - name: host
    type: string
    required: false
    default: 127.0.0.1
    pattern: ^[a-zA-Z0-9.-]+$
    description: ChromaDB host
  - name: port
    type: string
    required: false
    default: '8000'
    pattern: ^[0-9]+$
    description: ChromaDB HTTP port
