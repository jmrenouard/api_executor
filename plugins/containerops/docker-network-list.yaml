id: docker-network-list
name: Docker Container Networks Enumerator
version: 1.0.0
category: ContainerOps
description: Enumerate Docker container networks across bridge, host, null, overlay,
  and macvlan drivers.
os_family: any
actions:
- name: list_networks
  description: List Docker networks and scopes
  command: docker
  args:
  - network
  - ls
  - --format
  - '{{format}}'
  timeout: 5s
  parameters:
  - name: format
    type: string
    required: false
    default: "table {{.ID}}\t{{.Name}}\t{{.Driver}}\t{{.Scope}}"
    pattern: "^[a-zA-Z0-9. _\t-{}]+$"
    description: Format template string
