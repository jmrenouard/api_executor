id: docker-ps-active
name: Running Docker Containers & Port Mappings
version: 1.0.0
category: ContainerOps
description: List actively running Docker containers, image repositories, container
  names, and exposed ports.
os_family: any
actions:
- name: running_containers
  description: List running Docker containers
  command: docker
  args:
  - ps
  - --format
  - '{{format}}'
  timeout: 5s
  parameters:
  - name: format
    type: string
    required: false
    default: "table {{.ID}}\t{{.Image}}\t{{.Status}}\t{{.Names}}"
    pattern: "^[a-zA-Z0-9. _\t-{}]+$"
    description: Format template string
