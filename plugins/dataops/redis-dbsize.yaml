id: redis-dbsize
name: Redis Total Keys Count & Key-Space Telemetry
version: 1.0.0
category: DataOps
description: Count total keys stored in the currently selected Redis key-space database.
os_family: any
actions:
- name: db_size
  description: Execute DBSIZE command to retrieve key count
  command: redis-cli
  args:
  - -h
  - '{{host}}'
  - -p
  - '{{port}}'
  - dbsize
  timeout: 5s
  parameters:
  - name: host
    type: string
    required: false
    default: 127.0.0.1
    pattern: ^[a-zA-Z0-9.-]+$
    description: Redis host
  - name: port
    type: string
    required: false
    default: '6379'
    pattern: ^[0-9]+$
    description: Redis port
