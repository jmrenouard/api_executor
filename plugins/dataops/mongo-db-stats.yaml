id: mongo-db-stats
name: MongoDB Collection Storage & Index Footprint
version: 1.0.0
category: DataOps
description: Inspect MongoDB database storage size, document count, and index allocation.
os_family: any
actions:
- name: database_stats
  description: Query database storage and index statistics
  command: mongosh
  args:
  - --host
  - '{{host}}'
  - --port
  - '{{port}}'
  - --eval
  - db.stats()
  timeout: 5s
  parameters:
  - name: host
    type: string
    required: false
    default: 127.0.0.1
    pattern: ^[a-zA-Z0-9.-]+$
    description: MongoDB host
  - name: port
    type: string
    required: false
    default: '27017'
    pattern: ^[0-9]+$
    description: MongoDB port
