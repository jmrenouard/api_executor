id: crypto-jwt-payload
name: JSON Web Token (JWT) Claims Payload Claims Inspector
version: 1.0.0
category: WebUtils
description: Decode and inspect base64url JSON Web Token (JWT) payload claims and
  expiration timestamps.
os_family: any
actions:
- name: decode_payload
  description: Decode JWT payload part into formatted JSON
  command: python3
  args:
  - -c
  - import sys, base64, json; p=sys.argv[1].split('.')[1]; p+= '=' * ((4 - len(p)
    % 4) % 4); print(json.dumps(json.loads(base64.urlsafe_b64decode(p).decode())))
  - '{{jwt}}'
  timeout: 5s
  parameters:
  - name: jwt
    type: string
    required: false
    default: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkFkbWluIn0.signature
    pattern: ^[a-zA-Z0-9._-]+$
    description: JSON Web Token string
