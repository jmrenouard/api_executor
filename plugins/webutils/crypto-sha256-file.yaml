id: crypto-sha256-file
name: Cryptographic SHA-256 Digest Calculator
version: 1.0.0
category: WebUtils
description: Compute SHA-256 cryptographic digest of a local file via standard sha256sum.
os_family: any
actions:
- name: sha256_hash
  description: Calculate SHA-256 hash of file
  command: sha256sum
  args:
  - '{{file}}'
  timeout: 5s
  parameters:
  - name: file
    type: string
    required: false
    default: /tmp/test.txt
    pattern: ^/[a-zA-Z0-9._/-]+$
    description: Path to file to hash
