id: archive-tar-list
name: TAR Archive Table of Contents & File Enumerator
version: 1.0.0
category: WebUtils
description: List archive table of contents, file permissions, and member file sizes
  inside a TAR file.
os_family: any
actions:
- name: list_tar
  description: Enumerate files in tar archive
  command: tar
  args:
  - -tvf
  - '{{file}}'
  timeout: 5s
  parameters:
  - name: file
    type: string
    required: false
    default: /tmp/archive.tar
    pattern: ^/[a-zA-Z0-9._/-]+$
    description: Path to TAR archive file
