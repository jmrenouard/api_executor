id: archive-gzip-size
name: Gzip Compressed File Uncompressed Size Estimator
version: 1.0.0
category: WebUtils
description: Estimate uncompressed size and compression ratio of a gzipped file via
  gzip -l.
os_family: any
actions:
- name: gzip_size
  description: Display compression ratio and uncompressed size
  command: gzip
  args:
  - -l
  - '{{file}}'
  timeout: 5s
  parameters:
  - name: file
    type: string
    required: false
    default: /tmp/archive.gz
    pattern: ^/[a-zA-Z0-9._/-]+$
    description: Path to gzip file
