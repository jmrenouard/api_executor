name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Go Unit Tests
        run: go test -v -cover ./...

      - name: Run E2E Test Suite
        run: go test -v ./tests/e2e/...

      - name: Build Application Binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -v -ldflags="-w -s" -o bin/go-admin-tool ./cmd/server
