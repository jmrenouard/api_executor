name: Release Binaries & Packaging

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag override (e.g. v2.1.0, leave empty to auto-detect)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-binaries:
    name: Cross-Compile Binary (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary_name: go-admin-tool
            archive_ext: tar.gz
          - goos: linux
            goarch: arm64
            binary_name: go-admin-tool
            archive_ext: tar.gz
          - goos: darwin
            goarch: amd64
            binary_name: go-admin-tool
            archive_ext: tar.gz
          - goos: darwin
            goarch: arm64
            binary_name: go-admin-tool
            archive_ext: tar.gz
          - goos: windows
            goarch: amd64
            binary_name: go-admin-tool.exe
            archive_ext: zip
          - goos: windows
            goarch: arm64
            binary_name: go-admin-tool.exe
            archive_ext: zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Resolve Version Tag
        id: vars
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG=$(cat VERSION 2>/dev/null || echo "2.1.0")
          fi
          TAG="v${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved Release Tag: ${TAG}"

      - name: Compile Cross-Platform Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p build_output
          go build -v -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.vars.outputs.tag }}" \
            -o "build_output/${{ matrix.binary_name }}" ./cmd/server

      - name: Bundle Archive Deliverable
        run: |
          mkdir -p dist
          TAG="${{ steps.vars.outputs.tag }}"
          ARCHIVE_BASE="api_executor-${TAG}-${{ matrix.goos }}-${{ matrix.goarch }}"

          TMP_STAGE=$(mktemp -d)
          BUNDLE_DIR="${TMP_STAGE}/${ARCHIVE_BASE}"
          mkdir -p "${BUNDLE_DIR}"

          # Stage binary with verified POSIX executable permissions (0755)
          cp "build_output/${{ matrix.binary_name }}" "${BUNDLE_DIR}/"
          chmod 755 "${BUNDLE_DIR}/${{ matrix.binary_name }}"

          # Stage runtime configuration, license, documentation, plugins catalog, and web UI
          cp config.yaml LICENSE README.md "${BUNDLE_DIR}/"
          cp -r plugins "${BUNDLE_DIR}/"
          cp -r web "${BUNDLE_DIR}/"

          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            (cd "${TMP_STAGE}" && zip -rq "${GITHUB_WORKSPACE}/dist/${ARCHIVE_BASE}.zip" "${ARCHIVE_BASE}")
          else
            tar -czf "dist/${ARCHIVE_BASE}.tar.gz" -C "${TMP_STAGE}" "${ARCHIVE_BASE}"
          fi
          rm -rf "${TMP_STAGE}"

      - name: Upload Intermediate Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  publish-github-release:
    name: Publish Release Assets & SHA256 Manifest
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: download/
          merge-multiple: true

      - name: Resolve Release Tag
        id: release_vars
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG=$(cat VERSION 2>/dev/null || echo "2.1.0")
          fi
          TAG="v${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved Release Tag for Publication: ${TAG}"

      - name: Generate Cryptographic SHA256 Manifest
        run: |
          mkdir -p dist
          cp download/* dist/ 2>/dev/null || true
          cd dist
          sha256sum api_executor-* > SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt
          echo "Validating SHA256SUMS.txt integrity:"
          sha256sum -c SHA256SUMS.txt

      - name: Attach Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release_vars.outputs.tag }}
          files: |
            dist/api_executor-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
